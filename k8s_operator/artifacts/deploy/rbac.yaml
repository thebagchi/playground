apiVersion: v1
kind: ServiceAccount
metadata:
  name: dummy-operator
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dummy-operator
rules:
  # DummyResource permissions
  - apiGroups: ["dummycontroller.k8s.io"]
    resources: ["dummyresources"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["dummycontroller.k8s.io"]
    resources: ["dummyresources/status"]
    verbs: ["get", "update", "patch"]

  # Deployment permissions (if operator manages deployments)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]

  # Events permissions (for recording events)
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dummy-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dummy-operator
subjects:
  - kind: ServiceAccount
    name: dummy-operator
    namespace: default
